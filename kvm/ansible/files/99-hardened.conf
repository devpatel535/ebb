# /etc/sysctl.d/99-hardened.conf
#
# Engine B host hardening. Every line below has a stated reason; anything we
# could not justify was left out rather than included for the look of it.

# --- kernel information leaks ---------------------------------------------

# Hide kernel pointers from /proc and dmesg regardless of privilege. 2 rather
# than 1: with 1, a process with CAP_SYSLOG still reads real addresses, and on
# a single-user workstation that is most of what you care about.
kernel.kptr_restrict = 2

# Non-root cannot read the kernel ring buffer. Boot-time addresses, module
# load offsets, and hardware details all leak through dmesg.
kernel.dmesg_restrict = 1

# Do not leak kernel addresses through perf, and deny perf to unprivileged
# users entirely — perf_event_open has been a reliable source of LPEs.
kernel.perf_event_paranoid = 3
kernel.perf_event_max_sample_rate = 1

# --- ptrace ---------------------------------------------------------------

# 2 = admin-only attach. The spec said "disable ptrace scoping"; that is the
# wrong direction — scoping is the protection. 2 restricts ptrace to CAP_SYS_
# PTRACE holders, which stops one compromised process walking the memory of
# another (your browser reading your password manager).
#
# Use 3 to disable ptrace entirely if you never debug on this host; it cannot
# be lowered again without a reboot.
kernel.yama.ptrace_scope = 2

# --- eBPF -----------------------------------------------------------------

# Unprivileged BPF is a large verifier attack surface with a long CVE history
# and no use case on a VM host.
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2

# --- core dumps -----------------------------------------------------------
#
# A core dump of a QEMU process is a disk-resident copy of guest RAM. On an
# anonymity host that is the single worst artifact you can leave behind.
kernel.core_pattern = |/bin/false
fs.suid_dumpable = 0

# --- user namespaces ------------------------------------------------------
#
# Primary privilege-escalation ladder for container and kernel bugs. Set to 0
# if nothing on this host needs them; note that Flatpak, Podman rootless, and
# some browser sandboxes do. Left permissive-but-noted rather than silently
# breaking your desktop.
# user.max_user_namespaces = 0

# --- swap / memory --------------------------------------------------------
#
# Guest RAM on disk is the forensic leak that actually matters. The VM XML
# locks guest memory, but the host should also be reluctant to swap in
# general. Set to 0 to disable swap entirely if you have the RAM.
vm.swappiness = 1

# Deny access to kernel memory via /dev/mem even for root.
dev.tty.ldisc_autoload = 0

# --- network stack --------------------------------------------------------
#
# These reduce TCP/IP stack fingerprintability and drop classic spoofing and
# redirect attacks. On a host whose only interesting traffic is Tor leaving a
# NAT bridge, the win is mostly in not being individually identifiable.

net.ipv4.tcp_timestamps = 0
net.ipv4.tcp_syncookies = 1
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

net.ipv4.icmp_echo_ignore_all = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0

# Martian logging off — it is noise on a bridged virt host and the logs
# themselves become an artifact.
net.ipv4.conf.all.log_martians = 0

# --- filesystem -----------------------------------------------------------

fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
